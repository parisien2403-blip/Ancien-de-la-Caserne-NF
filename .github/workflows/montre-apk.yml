# Fabrique l'appli de la montre (APK) et la dépose sur le site : /montre-hologramme.apk
name: Appli montre
on:
  push:
    branches: [main]
    paths: ["montre-app/**", ".github/workflows/montre-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Fabriquer l'APK
        run: gradle -p montre-app assembleDebug --no-daemon
      - name: Le déposer sur le site
        run: |
          cp montre-app/app/build/outputs/apk/debug/app-debug.apk public/montre-hologramme.apk
          git config user.name "Germain-Pierre"
          git config user.email "parisien2403@msn.com"
          git add public/montre-hologramme.apk
          git commit -m "Appli montre : nouvelle version de l'APK" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: hologramme-montre
          path: montre-app/app/build/outputs/apk/debug/app-debug.apk
