plugins { id "com.android.application" }
android {
    namespace "fr.caserne.hologramme"
    compileSdk 34
    defaultConfig {
        applicationId "fr.caserne.hologramme"
        minSdk 30          // (Wear OS 3 et plus : Galaxy Watch 4 et suivantes)
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
