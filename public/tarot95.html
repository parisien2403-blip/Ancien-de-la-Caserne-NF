<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tarot</title>
<style>
  :root { --gris: #c0c0c0; --clair: #ffffff; --ombre: #808080; --noir: #000000; --bleu: #000080; --tapis: #0a6b2e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #008080; font: 12px "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Arial, sans-serif; user-select: none; -webkit-user-select: none; }
  .bosse { background: var(--gris); border: 2px solid; border-color: var(--clair) var(--noir) var(--noir) var(--clair); box-shadow: inset -1px -1px var(--ombre), inset 1px 1px #dfdfdf; }
  .creux { border: 2px solid; border-color: var(--ombre) var(--clair) var(--clair) var(--ombre); box-shadow: inset 1px 1px var(--noir); }
  button.b95 { font: inherit; min-width: 75px; height: 23px; padding: 0 10px; background: var(--gris); border: 2px solid; border-color: var(--clair) var(--noir) var(--noir) var(--clair); box-shadow: inset -1px -1px var(--ombre), inset 1px 1px #dfdfdf; cursor: pointer; color: #000; }
  button.b95:active { border-color: var(--noir) var(--clair) var(--clair) var(--noir); box-shadow: inset 1px 1px var(--ombre); }
  button.b95:disabled { color: var(--ombre); text-shadow: 1px 1px #fff; cursor: default; }
  /* le bureau */
  #bureau { position: absolute; inset: 0 0 28px 0; }
  .icone { position: absolute; width: 76px; text-align: center; color: #fff; cursor: pointer; }
  .icone .img { font-size: 30px; line-height: 36px; filter: drop-shadow(1px 1px 0 #000); }
  .icone span { display: inline-block; padding: 1px 2px; margin-top: 2px; }
  .icone.sel span { background: var(--bleu); outline: 1px dotted #ff0; }
  /* la barre des tâches */
  #taches { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; display: flex; align-items: center; gap: 4px; padding: 2px; background: var(--gris); border-top: 2px solid var(--clair); }
  #demarrer { min-width: 0; height: 22px; font-weight: bold; display: flex; align-items: center; gap: 4px; padding: 0 5px; }
  #demarrer i { font-style: normal; font-size: 14px; }
  #tacheTarot { height: 22px; min-width: 120px; max-width: 160px; text-align: left; display: flex; align-items: center; gap: 4px; }
  #tacheTarot.actif { border-color: var(--noir) var(--clair) var(--clair) var(--noir); box-shadow: inset 1px 1px var(--ombre); background: #dcdcdc; font-weight: bold; }
  #horloge { margin-left: auto; padding: 0 10px; height: 22px; line-height: 18px; }
  #menuDem { position: absolute; left: 2px; bottom: 28px; width: 190px; display: none; z-index: 50; }
  #menuDem .bande { position: absolute; left: 0; top: 0; bottom: 0; width: 22px; background: linear-gradient(#000080, #1084d0); color: #c0c0c0; writing-mode: vertical-rl; transform: rotate(180deg); font-weight: bold; font-size: 15px; padding: 6px 0; }
  #menuDem .bande b { color: #fff; }
  #menuDem div.it { padding: 7px 8px 7px 30px; cursor: pointer; }
  #menuDem div.it:hover { background: var(--bleu); color: #fff; }
  /* la fenêtre */
  #fen { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(980px, calc(100% - 8px)); height: min(700px, calc(100% - 36px)); display: flex; flex-direction: column; padding: 2px; }
  #fen.plein { left: 0; top: 0; transform: none; width: 100%; height: calc(100% - 28px); }
  .titre { height: 20px; display: flex; align-items: center; gap: 4px; padding: 0 2px 0 4px; background: linear-gradient(90deg, #000080, #1084d0); color: #fff; font-weight: bold; flex: none; }
  .titre .bt { margin-left: auto; display: flex; gap: 2px; }
  .titre .bt button { min-width: 0; width: 16px; height: 14px; padding: 0; font: bold 10px/9px Arial; }
  .titre .bt button + button + button { margin-left: 2px; }
  #menus { display: flex; flex: none; padding: 1px 0; position: relative; }
  #menus > div { padding: 2px 7px; cursor: pointer; position: relative; }
  #menus > div:hover, #menus > div.ouvert { background: var(--bleu); color: #fff; }
  #menus .deroule { display: none; position: absolute; left: 0; top: 100%; min-width: 170px; z-index: 40; color: #000; }
  #menus > div.ouvert .deroule { display: block; }
  #menus .deroule div { padding: 4px 20px; }
  #menus .deroule div:hover { background: var(--bleu); color: #fff; }
  #menus .deroule hr { border: 0; border-top: 1px solid var(--ombre); border-bottom: 1px solid #fff; margin: 3px 2px; }
  #tapis { flex: 1; position: relative; background: radial-gradient(ellipse at 50% 45%, #13883f 0%, var(--tapis) 70%, #064d20 100%); overflow: hidden; margin: 0 0 2px; }
  #statut { display: flex; gap: 2px; flex: none; }
  #statut > div { padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #statut > div:first-child { flex: 1; }
  /* les joueurs */
  .joueur { position: absolute; color: #fff; text-align: center; font-weight: bold; text-shadow: 1px 1px 0 #000; }
  .joueur .nom { display: inline-block; padding: 1px 6px; border-radius: 2px; }
  .joueur.tour .nom { background: #ffff00; color: #000; text-shadow: none; }
  .joueur .contrat { display: block; font-weight: normal; font-size: 11px; color: #ffe680; min-height: 14px; }
  .dos { position: absolute; width: var(--cw); height: calc(var(--cw) * 1.5); border-radius: 4px; border: 1px solid #000; background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.18) 0 2px, transparent 2px 6px), repeating-linear-gradient(-45deg, rgba(255,255,255,.18) 0 2px, transparent 2px 6px), #1a3fb0; box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 4px #1a3fb0; }
  /* les cartes */
  .carte { position: absolute; width: var(--cw); height: calc(var(--cw) * 1.5); border-radius: 5px; background: #fff; border: 1px solid #222; box-shadow: 1px 1px 2px rgba(0,0,0,.45); cursor: default; transition: transform .12s, top .12s; overflow: hidden; }
  .carte .coin { position: absolute; left: 3px; top: 2px; font: bold calc(var(--cw) * .2)/1 Arial, sans-serif; text-align: center; }
  .carte .coin.bas { left: auto; top: auto; right: 3px; bottom: 2px; transform: rotate(180deg); }
  .carte .coin small { display: block; font-size: calc(var(--cw) * .2); }
  .carte .milieu { position: absolute; inset: 22% 14%; display: flex; align-items: center; justify-content: center; font: calc(var(--cw) * .48)/1 Arial, sans-serif; }
  .carte.rouge { color: #d00; }
  .carte.noire { color: #000; }
  .carte .fig { position: absolute; inset: 20% 16%; border: 1px solid currentColor; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; font: bold calc(var(--cw) * .32)/1 Georgia, serif; background: linear-gradient(#fff8e0, #f3e2b0); }
  .carte .fig small { font-size: calc(var(--cw) * .26); }
  .carte.atout { background: linear-gradient(160deg, #fffdf2, #f1e8c8); color: #1c1c6c; }
  .carte.atout .vign { position: absolute; inset: 20% 14%; border: 1px solid #1c1c6c; border-radius: 3px; background: radial-gradient(circle at 50% 40%, #ffe9a0 0, #e8b84a 45%, #b5641e 100%); display: flex; align-items: center; justify-content: center; font: bold calc(var(--cw) * .38)/1 Georgia, serif; color: #2a1408; text-shadow: 0 1px 0 #fff3c0; }
  .carte.excuse .vign { background: radial-gradient(circle, #fff 0, #ffd6e8 50%, #c04a8a 100%); font-size: calc(var(--cw) * .42); }
  .main .carte.jouable { cursor: pointer; }
  .main .carte.jouable:hover { transform: translateY(-8px); }
  .main .carte.grise { filter: brightness(.62); }
  .main .carte.choisie { transform: translateY(-14px); box-shadow: 0 0 0 2px #ff0, 1px 1px 3px #000; }
  .pli .carte { transition: none; }
  /* les fenêtres de dialogue */
  .dialogue { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 260px; max-width: calc(100% - 16px); z-index: 30; padding: 2px; }
  .dialogue .corps { padding: 12px 12px 10px; }
  .dialogue .ligne { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .dialogue table { border-collapse: collapse; width: 100%; background: #fff; }
  .dialogue td, .dialogue th { border: 1px solid #a0a0a0; padding: 2px 6px; text-align: right; }
  .dialogue th { background: var(--gris); }
  .dialogue td:first-child, .dialogue th:first-child { text-align: left; }
  .bulle { position: absolute; background: #ffffe1; color: #000; border: 1px solid #000; padding: 2px 6px; font-size: 12px; white-space: nowrap; text-shadow: none; font-weight: normal; z-index: 20; }
  #boot { position: absolute; inset: 0; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
  #boot .logo { font: bold 34px Arial; letter-spacing: 1px; }
  #boot .logo b { font-size: 46px; color: #fff; }
  #boot .drap { display: grid; grid-template-columns: 26px 26px; gap: 3px; transform: skewX(-8deg); margin-bottom: 12px; }
  #boot .drap i { width: 26px; height: 22px; display: block; }
  #boot .barre { width: 220px; height: 8px; margin-top: 30px; background: linear-gradient(90deg, #000 0, #2a6af0 20%, #000 40%) 0 0 / 200% 100%; animation: defile 1s linear infinite; }
  @keyframes defile { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div id="boot"><div class="drap"><i style="background:#f02a12"></i><i style="background:#2aa82a"></i><i style="background:#1e5ef0"></i><i style="background:#f0c812"></i></div><div class="logo">Microsoft<sup>®</sup> Windows <b>95</b></div><div class="barre"></div></div>
<div id="bureau">
  <div class="icone" style="left:8px;top:8px"><div class="img">🖥️</div><span>Poste de travail</span></div>
  <div class="icone" style="left:8px;top:84px"><div class="img">🗑️</div><span>Corbeille</span></div>
  <div class="icone" id="icTarot" style="left:8px;top:160px"><div class="img">🃏</div><span>Tarot</span></div>
  <div id="fen" class="bosse">
    <div class="titre"><span>🃏</span><span>Tarot</span><div class="bt"><button class="b95" id="btMin">_</button><button class="b95" id="btMax">□</button><button class="b95" id="btFerm">✕</button></div></div>
    <div id="menus">
      <div id="mPartie"><u>P</u>artie<div class="deroule bosse"><div data-a="donne">Nouvelle donne</div><div data-a="partie">Nouvelle partie</div><hr><div data-a="scores">Scores…</div><hr><div data-a="quitter">Quitter</div></div></div>
      <div id="mAide"><u>A</u>ide<div class="deroule bosse"><div data-a="regles">Règles du jeu</div><hr><div data-a="apropos">À propos de Tarot…</div></div></div>
    </div>
    <div id="tapis" class="creux"></div>
    <div id="statut"><div class="creux" id="st1">Prêt</div><div class="creux" id="st2">Donne 1</div></div>
  </div>
</div>
<div id="taches">
  <button class="b95" id="demarrer"><i>🪟</i>Démarrer</button>
  <button class="b95 actif" id="tacheTarot">🃏 Tarot</button>
  <div class="creux" id="horloge">--:--</div>
</div>
<div id="menuDem" class="bosse"><div class="bande"><b>Windows</b>95</div><div class="it" data-a="tarot">🃏 Tarot</div><div class="it" data-a="donne">🔄 Nouvelle donne</div><div class="it" data-a="quitter">⏻ Arrêter…</div></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
// ---------- le bureau de Windows 95 ----------
setTimeout(() => { $("boot").remove(); nouvellePartie(); }, 1800);
const heure = () => { const d = new Date(); $("horloge").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }; heure(); setInterval(heure, 10000);
const fenetre = v => { $("fen").style.display = v ? "flex" : "none"; $("tacheTarot").style.display = v ? "" : "none"; if (v) placer(); };
$("btFerm").onclick = () => fenetre(false); $("btMin").onclick = () => { $("fen").style.display = "none"; $("tacheTarot").classList.remove("actif"); };
$("btMax").onclick = () => { $("fen").classList.toggle("plein"); placer(); };
$("tacheTarot").onclick = () => { const vis = $("fen").style.display !== "none"; $("fen").style.display = vis ? "none" : "flex"; $("tacheTarot").classList.toggle("actif", !vis); if (!vis) placer(); };
let clicIcone = 0; $("icTarot").onclick = () => { document.querySelectorAll(".icone").forEach(i => i.classList.remove("sel")); $("icTarot").classList.add("sel"); const t = Date.now(); if (t - clicIcone < 450 || matchMedia("(pointer: coarse)").matches) { fenetre(true); $("tacheTarot").classList.add("actif"); } clicIcone = t; };
$("demarrer").onclick = e => { e.stopPropagation(); const m = $("menuDem"); m.style.display = m.style.display === "block" ? "none" : "block"; };
document.addEventListener("click", e => { $("menuDem").style.display = "none"; if (!e.target.closest("#menus")) document.querySelectorAll("#menus > div").forEach(d => d.classList.remove("ouvert")); });
document.querySelectorAll("#menus > div").forEach(d => d.onclick = e => { e.stopPropagation(); const o = d.classList.contains("ouvert"); document.querySelectorAll("#menus > div").forEach(x => x.classList.remove("ouvert")); if (!o) d.classList.add("ouvert"); });
document.querySelectorAll("[data-a]").forEach(el => el.onclick = e => { e.stopPropagation(); document.querySelectorAll("#menus > div").forEach(x => x.classList.remove("ouvert")); $("menuDem").style.display = "none"; action(el.dataset.a); });
function action(a) {
  if (a === "tarot") { fenetre(true); $("tacheTarot").classList.add("actif"); }
  else if (a === "donne") { fenetre(true); nouvelleDonne(); }
  else if (a === "partie") nouvellePartie();
  else if (a === "scores") tableauScores();
  else if (a === "quitter") { try { parent.postMessage({ t: "tarot-fermer" }, "*"); } catch (e) {} }
  else if (a === "regles") dialogue("Règles du jeu", `<div style="max-width:420px;line-height:1.45">Vous jouez au Sud contre trois adversaires. Chacun reçoit 18 cartes, 6 vont au chien.<br><br>
    <b>Enchères</b> : Petite, Garde, Garde sans le chien, Garde contre le chien. Le preneur joue seul contre les trois autres.<br><br>
    <b>Jeu</b> : il faut fournir la couleur demandée ; sinon couper avec un atout (et monter sur l'atout le plus fort si possible) ; sinon défausser. L'Excuse se joue à tout moment et revient à son camp.<br><br>
    <b>Contrat</b> : le preneur doit faire 56 points sans bout, 51 avec un, 41 avec deux, 36 avec les trois bouts (le Petit, le 21 et l'Excuse).</div>`, [["OK"]]);
  else if (a === "apropos") dialogue("À propos de Tarot", `<div style="display:flex;gap:12px;align-items:center"><div style="font-size:34px">🃏</div><div><b>Tarot pour Windows 95</b><br>Version 1.0<br><br>Copyright © 1995<br>Caserne de la Nouvelle France</div></div>`, [["OK"]]);
}
// ---------- les cartes ----------
const COUL = ["P", "C", "K", "T"], SYM = { P: "♠", C: "♥", K: "♦", T: "♣" }, NOMC = { P: "pique", C: "cœur", K: "carreau", T: "trèfle" };
const FIG = { 11: "V", 12: "C", 13: "D", 14: "R" }, NOMS = ["Vous", "Robert", "Ginette", "Marcel"], PLACE = ["sud", "est", "nord", "ouest"];
const CONTRATS = ["Passe", "Petite", "Garde", "Garde sans", "Garde contre"], MULT = [0, 1, 2, 4, 6];
const jeu = () => { const j = []; for (const c of COUL) for (let v = 1; v <= 14; v++) j.push({ c, v }); for (let v = 1; v <= 21; v++) j.push({ c: "A", v }); j.push({ c: "E", v: 0 }); return j; };
const bout = k => k.c === "E" || (k.c === "A" && (k.v === 1 || k.v === 21));
const pts = k => bout(k) ? 4.5 : k.c === "A" ? .5 : k.v === 14 ? 4.5 : k.v === 13 ? 3.5 : k.v === 12 ? 2.5 : k.v === 11 ? 1.5 : .5;
const ordreTri = { A: 0, P: 1, C: 2, T: 3, K: 4, E: 5 };
const trier = m => m.sort((a, b) => ordreTri[a.c] - ordreTri[b.c] || a.v - b.v);
const nomCarte = k => k.c === "E" ? "l'Excuse" : k.c === "A" ? (k.v === 1 ? "le Petit" : `le ${k.v} d'atout`) : `${{ 1: "l'as", 11: "le valet", 12: "le cavalier", 13: "la dame", 14: "le roi" }[k.v] || "le " + k.v} de ${NOMC[k.c]}`;
// ---------- l'état ----------
let S = null, scores = [0, 0, 0, 0], historique = [], donneur = 3, numDonne = 0, attente = null;
function nouvellePartie() { scores = [0, 0, 0, 0]; historique = []; numDonne = 0; donneur = Math.floor(Math.random() * 4); nouvelleDonne(); }
function nouvelleDonne() {
  clearTimeout(attente); fermerDialogues(); numDonne++; donneur = (donneur + 1) % 4;
  let d; do { d = jeu(); for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; } } while (petitSec(d));
  S = { mains: [0, 1, 2, 3].map(p => trier(d.slice(p * 18, p * 18 + 18))), chien: d.slice(72), enchere: 0, preneur: -1, annonces: ["", "", "", ""], phase: "encheres", tour: (donneur + 1) % 4, parle: 0,
    pli: [], premier: -1, plis: [[], []], nPli: 0, choix: new Set(), dernierPli: null };
  $("st2").textContent = `Donne ${numDonne} — donneur : ${NOMS[donneur]}`; statut("Les enchères commencent.");
  placer(); attente = setTimeout(encheres, 600);
}
function petitSec(d) { for (let p = 0; p < 4; p++) { const m = d.slice(p * 18, p * 18 + 18), at = m.filter(k => k.c === "A"); if (at.length === 1 && at[0].v === 1 && !m.some(k => k.c === "E")) return true; } return false; }
const statut = t => { $("st1").textContent = t; };
// ---------- les enchères ----------
function force(m) { let f = 0; const at = m.filter(k => k.c === "A"); f += at.length * 1.2 + at.filter(k => k.v >= 16).length * .8;
  for (const k of m) { if (bout(k)) f += k.c === "A" && k.v === 1 ? (at.length >= 6 ? 4 : 1.5) : 4; if (k.c !== "A" && k.c !== "E") f += k.v === 14 ? 2.5 : k.v === 13 ? 1.2 : k.v === 12 ? .6 : 0; }
  for (const c of COUL) { const n = m.filter(k => k.c === c).length; if (n === 0) f += 2; else if (n === 1) f += 1; else if (n >= 6) f += n - 5; }
  return f; }
function encheres() {
  if (S.parle === 4) { if (S.preneur < 0) { dialogue("Tarot", "Tout le monde a passé. On redonne.", [["OK", nouvelleDonne]]); return; } return apresEncheres(); }
  const p = S.tour; placer();
  if (p === 0) {
    const bts = [["Passe", () => annonce(0, 0)]]; for (let c = 1; c <= 4; c++) if (c > S.enchere) bts.push([CONTRATS[c], () => annonce(0, c)]);
    dialogue("Enchères", `<div>Votre annonce ?${S.enchere ? `<br><small>(${NOMS[S.preneur]} a annoncé : ${CONTRATS[S.enchere]})</small>` : ""}</div>`, bts, true);
  } else { const f = force(S.mains[p]); let c = f >= 40 ? 4 : f >= 33 ? 3 : f >= 25 ? 2 : f >= 19 ? 1 : 0; if (c <= S.enchere) c = 0; attente = setTimeout(() => annonce(p, c), 700); }
}
function annonce(p, c) { S.annonces[p] = CONTRATS[c]; if (c > 0) { S.enchere = c; S.preneur = p; } statut(`${NOMS[p]} : ${CONTRATS[c]}`); S.parle++; S.tour = (S.tour + 1) % 4; placer(); attente = setTimeout(encheres, 350); }
function apresEncheres() {
  S.annonces = S.annonces.map((a, i) => i === S.preneur ? CONTRATS[S.enchere] : ""); const t = S.preneur;
  statut(`${NOMS[t]} ${t === 0 ? "prenez" : "prend"} une ${CONTRATS[S.enchere]}.`);
  if (S.enchere >= 3) { (S.enchere === 3 ? S.plis[0] : S.plis[1]).push(...S.chien); S.chien = []; return commencerJeu(); }
  // le chien est montré à tous, puis le preneur fait son écart
  S.phase = "chien"; placer();
  attente = setTimeout(() => { S.mains[t].push(...S.chien); trier(S.mains[t]); S.chien = [];
    if (t === 0) { S.phase = "ecart"; S.choix = new Set(); statut("Choisissez 6 cartes à écarter (ni roi, ni bout ; pas d'atout sauf si obligé)."); placer(); }
    else { const ec = ecartIA(S.mains[t]); S.plis[0].push(...ec); S.mains[t] = S.mains[t].filter(k => !ec.includes(k)); commencerJeu(); } }, 2200);
}
const ecartable = (m, k) => { if (k.c === "E" || (k.c !== "A" && k.v === 14) || bout(k)) return false; if (k.c === "A") return m.filter(x => x.c !== "A" && x.c !== "E" && x.v !== 14).length < 6; return true; };
function ecartIA(m) { const n = c => m.filter(k => k.c === c).length;
  const cand = m.filter(k => ecartable(m, k) && k.c !== "A").sort((a, b) => n(a.c) - n(b.c) || pts(b) - pts(a)); const ec = cand.slice(0, 6);
  if (ec.length < 6) ec.push(...m.filter(k => k.c === "A" && !bout(k)).sort((a, b) => a.v - b.v).slice(0, 6 - ec.length)); return ec; }
function validerEcart() { const ec = S.mains[0].filter((k, i) => S.choix.has(i)); S.plis[0].push(...ec); S.mains[0] = S.mains[0].filter((k, i) => !S.choix.has(i)); S.choix = new Set(); commencerJeu(); }
// ---------- le jeu de la carte ----------
function commencerJeu() { S.phase = "jeu"; S.tour = (donneur + 1) % 4; S.premier = S.tour; S.pli = []; placer(); attente = setTimeout(jouerTour, 600); }
const camp = p => p === S.preneur ? 0 : 1;
