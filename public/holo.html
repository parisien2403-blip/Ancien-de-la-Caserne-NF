<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>Hologramme</title>
<style>
  :root { --cyan: #5ee6ff; --fond: #000; --texte: #e8fbff; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #cam, #scene { position: fixed; inset: 0; width: 100%; height: 100%; }
  #cam { object-fit: cover; background: #000; }
  #accueil { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center;
    background: radial-gradient(circle at 50% 35%, #0b3550 0%, #02121d 55%, #000 100%); }
  #accueil h1 { margin: 0; font-size: clamp(28px, 7vw, 44px); letter-spacing: 1px; color: var(--cyan); text-shadow: 0 0 18px rgba(94,230,255,.7); }
  #accueil p { margin: 0; max-width: 460px; line-height: 1.45; font-size: 16px; opacity: .9; }
  .montre { font-size: 64px; filter: drop-shadow(0 0 16px rgba(94,230,255,.8)); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .gros { border: 2px solid var(--cyan); border-radius: 999px; padding: 14px 34px; background: rgba(94,230,255,.15); color: #fff; font: 700 19px system-ui, Arial; box-shadow: 0 0 22px rgba(94,230,255,.45); cursor: pointer; }
  #barre { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: none; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.65)); }
  #barre button, #barre label { border: 1px solid rgba(94,230,255,.6); border-radius: 999px; padding: 10px 16px; background: rgba(0,20,30,.6); color: #fff; font: 600 15px system-ui, Arial; cursor: pointer; backdrop-filter: blur(6px); }
  #barre .actif { background: rgba(94,230,255,.3); }
  #info { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 4; max-width: calc(100% - 32px); padding: 8px 16px; border-radius: 999px; background: rgba(0,20,30,.65); border: 1px solid rgba(94,230,255,.45); font: 600 15px system-ui, Arial; text-align: center; display: none; }
  #erreur { color: #ffb4a8; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="scene"></canvas>

<div id="accueil">
  <div class="montre">⌚</div>
  <h1>Hologramme</h1>
  <p>Filme ta montre avec la caméra, puis <b>touche-la sur l'écran</b> : la personne qui t'appelle en sort en hologramme.</p>
  <p style="font-size:14px;opacity:.7">Ça marche aussi sur une table ou un objet : touche l'endroit d'où elle doit sortir.</p>
  <button class="gros" id="go" type="button">▶ Démarrer</button>
  <p id="erreur"></p>
</div>
<div id="info"></div>
<div id="barre">
  <button type="button" id="bDemo" class="actif">🎬 Démo</button>
  <label>📁 Ma vidéo<input type="file" id="fichier" accept="video/*" hidden></label>
  <button type="button" id="bFin" style="display:none;background:rgba(200,40,40,.75);border-color:#ff8a8a">📴 Raccrocher</button>
  <button type="button" id="bQuit">✕ Quitter</button>
</div>

<script type="module">
import { FilesetResolver, ImageSegmenter } from "./vendor/mediapipe/vision_bundle.mjs";

const $ = s => document.querySelector(s);
const cam = $("#cam"), scene = $("#scene"), cx = scene.getContext("2d");
const info = (t, ms) => { const e = $("#info"); e.textContent = t; e.style.display = t ? "block" : "none"; clearTimeout(info.t); if (t && ms) info.t = setTimeout(() => info(""), ms); };

/* ---------- la source de l'hologramme : la démo (le chef de poste) ou une vidéo du téléphone, détourée en direct ---------- */
const src = { c: document.createElement("canvas"), video: null, demo: true, boite: null, pret: false };
const masqueC = document.createElement("canvas"), mx = masqueC.getContext("2d");
let segImg = null, segVid = null;

// le masque de la personne (ce que l'IA juge « humain ») → la transparence de l'image

  const mw = masque.width, mh = masque.height, f = masque.getAsFloat32Array();
  if (masqueC.width !== mw || masqueC.height !== mh) { masqueC.width = mw; masqueC.height = mh; }
  const id = mx.createImageData(mw, mh), d = id.data;
  let x0 = mw, y0 = mh, x1 = 0, y1 = 0;
  for (let i = 0; i < f.length; i++) { const a = Math.max(0, Math.min(1, (f[i] - .35) / .4)); d[i * 4 + 3] = a * 255;
    if (a > .5) { const x = i % mw, y = (i / mw) | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } }

    src.boite = src.boite ? { x: src.boite.x + (b.x - src.boite.x) * .2, y: src.boite.y + (b.y - src.boite.y) * .2, w: src.boite.w + (b.w - src.boite.w) * .2, h: src.boite.h + (b.h - src.boite.h) * .2 } : b; }
}

async function chargerDemo() {
  const im = new Image(); im.src = "images/garde-poste.jpg"; await im.decode();
  const cadre = { x: 290, y: 95, w: 420, h: 450 };   // (le chef de poste, derrière son comptoir)
  const c = src.c; c.width = cadre.w; c.height = cadre.h; const g = c.getContext("2d");
  g.drawImage(im, cadre.x, cadre.y, cadre.w, cadre.h, 0, 0, cadre.w, cadre.h);
  const r = segImg.segment(c); appliquerMasque(g, c.width, c.height, r.confidenceMasks[0]); r.close && r.close();
  src.boite = { x: 0, y: 0, w: c.width, h: c.height }; src.pret = true;
}

function choisirVideo(fichier) {
  if (src.video) { src.video.pause(); URL.revokeObjectURL(src.video.src); }
  const v = document.createElement("video"); v.src = URL.createObjectURL(fichier); v.loop = true; v.playsInline = true; v.muted = true;
  v.onloadeddata = () => { src.video = v; src.demo = false; src.boite = null; src.pret = true; v.play().catch(() => {}); info("Vidéo chargée : montre ta montre ⌚", 3000); };
  $("#bDemo").classList.remove("actif");
}

let dernierSeg = -1;
function majSource(t) {
  const v = src.video; if (src.demo || !v || v.readyState < 2) return;
  if (v.currentTime === dernierSeg) return; dernierSeg = v.currentTime;
  const c = src.c, s = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight)), w = Math.round(v.videoWidth * s), h = Math.round(v.videoHeight * s);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const g = c.getContext("2d"); g.clearRect(0, 0, w, h); g.drawImage(v, 0, 0, w, h);
  const r = segVid.segmentForVideo(c, t); appliquerMasque(g, w, h, r.confidenceMasks[0]); r.close && r.close();
}

/* ---------- le son : la sonnerie, le souffle de l'ouverture, le bourdonnement ---------- */
let AC = null, bourdon = null;
const son = (f, d, type = "sine", vol = .15, f2) => { if (!AC) return; const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;

const fermeture = () => son(1600, .35, "sine", .06, 160);

  if (on && !bourdon) { const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 110; o2.frequency.value = 111.5; o.type = o2.type = "triangle"; g.gain.value = 0; g.gain.linearRampToValueAtTime(.025, AC.currentTime + .4); o.connect(g); o2.connect(g); g.connect(AC.destination); o.start(); o2.start(); bourdon = { o, o2, g }; }

function parler() {
  if (!src.demo) { if (src.video) { src.video.muted = false; src.video.currentTime = 0; src.video.play().catch(() => {}); } return; }
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance("Allô ? Ici le chef de poste de la caserne Nouvelle-France. Je te reçois cinq sur cinq ! Rendez-vous dans la cour d'honneur : la course de karts va commencer.");
    u.lang = "fr-FR"; u.rate = 1; u.pitch = .8; const voix = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang)); const h = voix.find(v => /male|homme|thomas|paul|henri|guillaume/i.test(v.name)); if (h || voix[0]) u.voice = h || voix[0];
    u.onstart = () => holo.parle = true; u.onend = () => holo.parle = false; speechSynthesis.speak(u); } catch (e) { }

function taire() { try { speechSynthesis.cancel(); } catch (e) { } holo.parle = false; if (src.video) src.video.muted = true; }

/* ---------- l'hologramme : il sort de la montre quand le poignet est à l'image, et s'y replie quand on baisse le bras ---------- */

const tampon = document.createElement("canvas"), tx = tampon.getContext("2d");

  pg.drawImage(cam, 0, 0, LARG, h); const d = pg.getImageData(0, 0, LARG, h).data, g = new Float32Array(LARG * h);
  for (let i = 0; i < g.length; i++) g[i] = d[i * 4] * .3 + d[i * 4 + 1] * .59 + d[i * 4 + 2] * .11; return { g, w: LARG, h }; }

function carre(I, cx, cy, T) { const n = T >> 1, t = new Float32Array(n * n), r = T >> 1; let m = 0;
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const x = Math.min(I.w - 1, Math.max(0, cx - r + i * 2)), y = Math.min(I.h - 1, Math.max(0, cy - r + j * 2)), v = I.g[y * I.w + x]; t[j * n + i] = v; m += v; }

  const x = Math.round((sx - C.ox) / C.s * k), y = Math.round((sy - C.oy) / C.s * k), T = 2 * Math.round(LARG * .1), I = imageGrise();

  if (now !== suivi.t) { suivi.t = now; const I = imageGrise(), { T, tpl } = suivi, R = 16; let best = 1e9, bx = suivi.x, by = suivi.y;
    for (let dy = -R; dy <= R; dy += 2) for (let dx = -R; dx <= R; dx += 2) { const e = ecart(I, suivi.x + dx, suivi.y + dy, T, tpl); if (e < best) { best = e; bx = suivi.x + dx; by = suivi.y + dy; } }

    const P = cadran.suiv, e = affiner(P, .8, 1.22, .12, 22);
    if (e && Math.hypot(e.x - P.x, e.y - P.y) < P.a * .6 && e.a / P.a > .9 && e.a / P.a < 1.12 && e.b / e.a > .38 && e.a / cadran.a0 > .75 && e.a / cadran.a0 < 1.35) { cadran.suiv = e; cadran.perdu = 0; cadran.a0 += (e.a - cadran.a0) * .03; }   // (la largeur du cadran ne change presque pas quand on incline le poignet — seule sa hauteur)
    else { cadran.perdu += dt || .03; if (cadran.perdu > .5) { cadran.suiv = null; cadran.der = null; cadran.vu = 0; } } }

    const roger = k => { for (let e = 0; e < k; e++) { for (let i = 0; i < N; i++) { const x = i % w; m2[i] = mk[i] && x > 0 && x < w - 1 && i >= w && i < N - w && mk[i - 1] && mk[i + 1] && mk[i - w] && mk[i + w] ? 1 : 0; } mk.set(m2); } };

        while (sp) { const i = pile[--sp], x = i % w, y = (i / w) | 0; n++; sx += x; sy += y; sxx += x * x; syy += y * y; sxy += x * y;

          if (x > 0 && !lab[i - 1] && mk[i - 1]) { lab[i - 1] = id; pile[sp++] = i - 1; }

          if (y > 0 && !lab[i - w] && mk[i - w]) { lab[i - w] = id; pile[sp++] = i - w; }

/* ---------- au millimètre : le vrai bord du cadran, mesuré en pleine définition ----------

  for (let n = 0; n < 64; n++) { const t = n / 64 * Math.PI * 2, ux = Math.cos(t), uy = Math.sin(t);
    // (le rayon attendu dans cette direction, d'après l'ovale grossier)
    const ct = Math.cos(t - d.ang), st = Math.sin(t - d.ang), re = A * B / Math.hypot(B * ct, A * st);
    let mg = 0, mr = 0; for (let r = re * lo; r < re * hi; r += .5) { const a1 = lire(c + ux * (r + 2), c + uy * (r + 2)), a0 = lire(c + ux * (r - 2), c + uy * (r - 2)); if (a1 < 0 || a0 < 0) break; const gr = (a1 - a0) * Math.exp(-(((r - re) / (sig * re)) ** 2)); if (gr > mg) { mg = gr; mr = r; } }   // (le bord le plus net, et le plus près de celui qu'on attend)
    if (mg > 9) pts.push([ux * mr, uy * mr]); }
  if (pts.length < 22) return null;
  let e = ajusterOvale(pts, A); if (!e) return null; let gard = pts;
  for (let it = 0; it < 2; it++) {   // (on écarte les points trop loin de l'ovale, et on recommence)
    const err = pts.map(([x, y]) => Math.abs(Math.hypot(x - e.x, y - e.y) - rayonOvale(e, Math.atan2(y - e.y, x - e.x)))), med = err.slice().sort((a, b) => a - b)[err.length >> 1];
    const g2 = pts.filter((p, i) => err[i] <= Math.max(1.5, med * 2.5)); if (g2.length < 20) break; const e2 = ajusterOvale(g2, A); if (!e2) break; e = e2; gard = g2; }
  if (gard.length < 22 || Math.hypot(e.x, e.y) > A * .35 || e.a < A * .65 || e.a > A * 1.5 || e.b / e.a < .3) return null;   // (trop peu de points sur le bord : on ne croit pas cette image)
  // (un vrai cadran : sombre dedans, nettement plus clair autour)
  let dedans = 0, autour = 0, nd = 0, na = 0; for (let n = 0; n < 48; n++) { const t = n / 48 * Math.PI * 2, r = rayonOvale(e, t);
    for (const [q, dans] of [[.35, 1], [.6, 1], [1.25, 0], [1.4, 0]]) { const v = lire(c + e.x + Math.cos(t) * r * q, c + e.y + Math.sin(t) * r * q); if (v < 0) continue; if (dans) { dedans += v; nd++; } else { autour += v; na++; } } }
  if (!nd || !na || dedans / nd > 130 || autour / na - dedans / nd < contraste || e.a / f > cam.videoWidth * .33) return null;
  return { x: x0 + (c + e.x) / f, y: y0 + (c + e.y) / f, a: e.a / f, b: e.b / f, ang: e.ang }; }

// (l'ovale par les moindres carrés : A x² + B xy + C y² + D x + E y = 1, en coordonnées réduites)
function ajusterOvale(pts, s) { const M = Array.from({ length: 5 }, () => new Float64Array(6));
  for (const [X, Y] of pts) { const x = X / s, y = Y / s, v = [x * x, x * y, y * y, x, y]; for (let i = 0; i < 5; i++) { for (let j = 0; j < 5; j++) M[i][j] += v[i] * v[j]; M[i][5] += v[i]; } }
  for (let i = 0; i < 5; i++) { let p = i; for (let r = i + 1; r < 5; r++) if (Math.abs(M[r][i]) > Math.abs(M[p][i])) p = r; [M[i], M[p]] = [M[p], M[i]]; if (Math.abs(M[i][i]) < 1e-12) return null;
    for (let r = 0; r < 5; r++) if (r !== i) { const q = M[r][i] / M[i][i]; for (let cc = i; cc < 6; cc++) M[r][cc] -= q * M[i][cc]; } }
  const [a, b, cq, dq, eq] = M.map((r, i) => r[5] / r[i]), F = -1, den = b * b - 4 * a * cq; if (den >= 0) return null;
  const x0 = (2 * cq * dq - b * eq) / den, y0 = (2 * a * eq - b * dq) / den, Fc = F + (dq * x0 + eq * y0) / 2;
  const ang = .5 * Math.atan2(b, a - cq), l1 = a * Math.cos(ang) ** 2 + b * Math.cos(ang) * Math.sin(ang) + cq * Math.sin(ang) ** 2, l2 = a * Math.sin(ang) ** 2 - b * Math.cos(ang) * Math.sin(ang) + cq * Math.cos(ang) ** 2;

  return { x: x0 * s, y: y0 * s, a: r1 * s, b: r2 * s, ang: an }; }

function dessinerHolo(now, dt) {
  const W = scene.width / devicePixelRatio, H = scene.height / devicePixelRatio;
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); cx.clearRect(0, 0, W, H);
  if (holo.k <= .001 || !src.pret || !src.boite) return;
  const k = holo.k, b = src.boite, ratio = b.w / b.h;
  const h = holo.taille * k, w = h * ratio, x = holo.x, y = holo.y;   // (x, y : la montre ; la personne se tient au-dessus)
  const lev = 10 + holo.taille * .06 + (holo.ea > 0 ? holo.eb * .55 : 0);   // (elle flotte un peu au-dessus du cadran)

  // le faisceau, du cadran jusqu'à la personne
  cx.save(); cx.globalCompositeOperation = "lighter";
  const fh = h + lev, gr = cx.createLinearGradient(x, y, x, y - fh);
  gr.addColorStop(0, `rgba(94,230,255,${.55 * Math.min(1, k * 2)})`); gr.addColorStop(.25, "rgba(94,230,255,.18)"); gr.addColorStop(1, "rgba(94,230,255,0)");
  cx.fillStyle = gr; cx.beginPath(); const bz = holo.ea > 0 ? holo.ea * .8 : 6, bzb = holo.ea > 0 ? holo.eb * .8 : 2; cx.ellipse(x, y, bz, bzb, 0, 0, Math.PI); cx.lineTo(x - w * .62, y - fh); cx.lineTo(x + w * .62, y - fh); cx.closePath(); cx.fill();   // (le faisceau part de tout le cadran)
  // le socle : des anneaux lumineux qui tournent sur le cadran
  // (le cadran repéré : les anneaux épousent son contour, vu de biais ; sinon, un socle à plat)
  const auto = holo.ea > 0, rr = auto ? holo.ea : Math.max(14, w * .32), rb = auto ? holo.eb : rr * .28, ang = auto ? holo.ang : 0, ap = Math.min(1, k * 2 + (holo.etat === "sonne" ? .5 : 0));
  for (let i = 0; i < 3; i++) { const f = auto ? [1, .82, 1.18][i] : 1 + i * .35; cx.strokeStyle = `rgba(120,240,255,${(.85 - i * .2) * ap})`; cx.lineWidth = auto ? 3 - i : 2 - i * .5; cx.setLineDash(i === 1 ? [8, 10] : []); cx.lineDashOffset = -now / 30 * (i + 1);
    cx.shadowColor = "rgba(94,230,255,.9)"; cx.shadowBlur = auto ? 10 : 0; cx.beginPath(); cx.ellipse(x, y, rr * f, rb * f, ang, 0, Math.PI * 2); cx.stroke(); }
  cx.shadowBlur = 0; cx.setLineDash([]); const halo = cx.createRadialGradient(x, y, 0, x, y, rr); halo.addColorStop(0, "rgba(160,250,255,.38)"); halo.addColorStop(1, "rgba(94,230,255,.04)");
  cx.fillStyle = halo; cx.beginPath(); cx.ellipse(x, y, rr * (auto ? 1 : 1.4), rb * (auto ? 1 : 1.6), ang, 0, Math.PI * 2); cx.fill(); cx.restore();

  if (h < 4) return;
  // la personne, teintée de bleu, rayée de lignes, qui scintille
  const tw = Math.ceil(w), th = Math.ceil(h); if (tampon.width !== tw || tampon.height !== th) { tampon.width = tw; tampon.height = th; }
  tx.globalCompositeOperation = "source-over"; tx.globalAlpha = 1; tx.clearRect(0, 0, tw, th);
  const resp = holo.parle ? 1 + Math.sin(now / 90) * .006 : 1 + Math.sin(now / 900) * .004;   // (elle respire ; un peu plus quand elle parle)
  tx.drawImage(src.c, b.x, b.y, b.w, b.h, 0, th * (1 - resp), tw, th * resp);
  tx.globalCompositeOperation = "source-atop";
  tx.fillStyle = "rgba(60,190,255,.38)"; tx.fillRect(0, 0, tw, th);
  tx.fillStyle = "rgba(0,10,25,.35)"; const pas = Math.max(3, th / 110), dec = (now / 40) % pas; for (let ly = -pas + dec; ly < th; ly += pas) tx.fillRect(0, ly, tw, pas * .45);
  const bande = (now / 7) % (th * 1.6) - th * .3; const gb = tx.createLinearGradient(0, bande - 20, 0, bande + 20); gb.addColorStop(0, "rgba(160,250,255,0)"); gb.addColorStop(.5, "rgba(160,250,255,.35)"); gb.addColorStop(1, "rgba(160,250,255,0)"); tx.fillStyle = gb; tx.fillRect(0, bande - 20, tw, 40);
  // (elle sort du faisceau : le bas se fond dans la lumière)
  tx.globalCompositeOperation = "destination-out"; const gf = tx.createLinearGradient(0, th, 0, th * .82); gf.addColorStop(0, "rgba(0,0,0,.85)"); gf.addColorStop(1, "rgba(0,0,0,0)"); tx.fillStyle = gf; tx.fillRect(0, th * .82, tw, th * .18);

  const scint = .82 + Math.random() * .1 - (Math.random() < .03 ? .35 : 0);
  const px = x - w / 2, py = y - lev - h;
  cx.save(); cx.globalAlpha = scint * Math.min(1, k * 1.4); cx.shadowColor = "rgba(94,230,255,.9)"; cx.shadowBlur = 18;
  if (Math.random() < .05) {   // (un petit accroc : une tranche décalée)
    const sy = Math.random() * th, sh = 4 + Math.random() * th * .08, d = (Math.random() - .5) * w * .12;
    cx.drawImage(tampon, 0, 0, tw, sy, px, py, w, sy); cx.drawImage(tampon, 0, sy, tw, sh, px + d, py + sy, w, sh); cx.drawImage(tampon, 0, sy + sh, tw, th - sy - sh, px, py + sy + sh, w, th - sy - sh);
  } else cx.drawImage(tampon, px, py, w, h);
  cx.shadowBlur = 0; cx.globalCompositeOperation = "lighter"; cx.globalAlpha = .25 * scint; cx.drawImage(tampon, px, py, w, h);   // (la lueur)
  cx.restore();
}

/* le filtre « un euro » : immobile, on lisse fort (plus de tremblote) ; quand ça bouge vite, on suit sans retard */
function lisse(cle, v, dt, coupMin, beta) { const F = holo.filt = holo.filt || {}, s = F[cle]; dt = Math.max(dt, 1e-3);
  if (!s) { F[cle] = { v, d: 0 }; return v; }
  const ad = 1 / (1 + 1 / (2 * Math.PI * 1 * dt)), dv = (v - s.v) / dt; s.d += (dv - s.d) * ad;
  const coup = coupMin + beta * Math.abs(s.d), al = 1 / (1 + 1 / (2 * Math.PI * coup * dt)); s.v += (v - s.v) * al; return s.v; }

function boucle() {
  const now = performance.now(), dt = Math.min(.1, (now - (boucle.t || now)) / 1000); boucle.t = now;
  try { majSource(now); } catch (e) { console.warn(e); }
  let m = null; try { m = chercherCadran(dt); } catch (e) { console.warn(e); }
  if (m) suivi.on = false; else try { m = suivi.on ? suivreMontre(dt) : null; } catch (e) { console.warn(e); }   // (le cadran pas trouvé : celui qu'on a touché à l'écran)
  if (m && m.ea) { if (!holo.ea || holo.k < .05) Object.assign(holo, { ea: m.ea, eb: m.eb, ang: m.ang, filt: {} });
    holo.ea = lisse("ea", m.ea, dt, 1.5, .02); holo.eb = lisse("eb", m.eb, dt, 1.5, .02);
    let da = m.ang - holo.ang; da = Math.atan2(Math.sin(2 * da), Math.cos(2 * da)) / 2; holo.ang += da * Math.min(1, dt * (m.eb / m.ea > .93 ? 2 : 10)); }   // (presque rond : l'inclinaison ne veut rien dire, on la laisse tranquille)
  else if (m) holo.ea = 0;
  if (m) { holo.vu += dt; holo.perdu = 0;
    const cible = Math.max(110, Math.min(innerHeight * .6, (m.ech || 0) * 4.2));
    if (holo.etat === "attente" || !holo.x || holo.k < .05) { holo.x = m.x; holo.y = m.y; holo.taille = cible; }   // (de retour sur la montre : il repart d'elle)
    if (m.ea) { holo.x = lisse("x", m.x, dt, 2, .015); holo.y = lisse("y", m.y, dt, 2, .015); }
    else { const a = 1 - Math.exp(-dt * 14); holo.x += (m.x - holo.x) * a; holo.y += (m.y - holo.y) * a; } holo.taille += (cible - holo.taille) * (1 - Math.exp(-dt * 4)); }
  else { holo.perdu += dt; if (holo.perdu > .25) holo.vu = 0; }
  // l'appel : le poignet reste à l'image → ça sonne, puis la personne apparaît ; le bras baissé → elle se replie dans la montre
  if (holo.etat === "attente" && holo.vu > .35) { holo.etat = "sonne"; holo.t = 0; sonnerie(); info("📞 Appel entrant…"); }
  else if (holo.etat === "sonne") { holo.t += dt; if (!m && holo.perdu > .8) { holo.etat = "attente"; info(""); } else if (holo.t > 1) { holo.etat = "ouvert"; ouverture(); bourdonner(true); info(src.demo ? "Le chef de poste" : "", 2500); setTimeout(() => holo.etat === "ouvert" && parler(), 700); $("#bFin").style.display = ""; } }
  // (pendant l'appel : la montre sort de l'image → l'hologramme se replie, mais la conversation continue ; on y revient → il ressort aussitôt)
  else if (holo.etat === "ouvert") { const cache = !m && holo.perdu > .4; if (cache !== !!holo.cache) { holo.cache = cache; bourdonner(!cache); if (cache) { fermeture(); info("📞 En ligne : reviens sur ta montre", 2500); } else ouverture(); } }
  const voulu = holo.etat === "ouvert" ? (holo.cache ? 0 : 1) : holo.etat === "sonne" ? .06 : 0;
  holo.k += (voulu - holo.k) * (1 - Math.exp(-dt * (voulu > holo.k ? 4.5 : 9))); if (holo.k < .002 && !voulu) holo.k = 0;
  dessinerHolo(now, dt);
  requestAnimationFrame(boucle);
}

function taille() { scene.width = innerWidth * devicePixelRatio; scene.height = innerHeight * devicePixelRatio; }
addEventListener("resize", taille); taille();

// toucher sa montre sur l'écran : le téléphone la suit, et l'hologramme en sort (ça marche aussi sur une table, un objet…)
scene.addEventListener("pointerdown", e => verrouiller(e.clientX, e.clientY));

$("#fichier").addEventListener("change", e => { const f = e.target.files[0]; if (f) choisirVideo(f); });
$("#bDemo").onclick = async () => { if (src.video) { src.video.pause(); src.video = null; } src.demo = true; $("#bDemo").classList.add("actif"); await chargerDemo(); };
$("#bFin").onclick = () => { if (holo.etat !== "ouvert") return; holo.etat = "attente"; holo.cache = false; holo.vu = -1.5; fermeture(); bourdonner(false); taire(); info("Appel terminé", 2000); $("#bFin").style.display = "none"; };   // (et ça ne resonne pas tout de suite)
$("#bQuit").onclick = () => { location.href = "/"; };

$("#go").onclick = async () => {
  const go = $("#go"); go.disabled = true; go.textContent = "Chargement…"; $("#erreur").textContent = "";
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch (e) { }
  try { speechSynthesis.getVoices(); } catch (e) { }
  try {
    const flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    cam.srcObject = flux; await cam.play();
  } catch (e) { $("#erreur").textContent = "Je n'ai pas accès à la caméra : autorise-la dans le navigateur, puis réessaie."; go.disabled = false; go.textContent = "▶ Démarrer"; return; }
  try {
    const vision = await FilesetResolver.forVisionTasks("vendor/mediapipe/wasm");
    const creer = async (delegate) => {
      segImg = await ImageSegmenter.createFromOptions(vision, { baseOptions: { modelAssetPath: "vendor/mediapipe/selfie_segmenter.tflite", delegate }, runningMode: "IMAGE", outputConfidenceMasks: true, outputCategoryMask: false });
      segVid = await ImageSegmenter.createFromOptions(vision, { baseOptions: { modelAssetPath: "vendor/mediapipe/selfie_segmenter.tflite", delegate }, runningMode: "VIDEO", outputConfidenceMasks: true, outputCategoryMask: false });
    };
    try { await creer("GPU"); } catch (e) { console.warn("GPU indisponible, on passe au processeur", e); await creer("CPU"); }
    await chargerDemo();
  } catch (e) { console.error(e); $("#erreur").textContent = "Le chargement a échoué : " + (e.message || e); go.disabled = false; go.textContent = "▶ Démarrer"; return; }
  $("#accueil").style.display = "none"; $("#barre").style.display = "flex";
  info("⌚ Filme ta montre (si elle n'est pas repérée, touche-la)", 6000);
  requestAnimationFrame(boucle);
};
