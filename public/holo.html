<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>Hologramme</title>
<style>
  :root { --cyan: #5ee6ff; --fond: #000; --texte: #e8fbff; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #cam, #scene { position: fixed; inset: 0; width: 100%; height: 100%; }
  #cam { object-fit: cover; background: #000; }
  #accueil { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center;
    background: radial-gradient(circle at 50% 35%, #0b3550 0%, #02121d 55%, #000 100%); }
  #accueil h1 { margin: 0; font-size: clamp(28px, 7vw, 44px); letter-spacing: 1px; color: var(--cyan); text-shadow: 0 0 18px rgba(94,230,255,.7); }
  #accueil p { margin: 0; max-width: 460px; line-height: 1.45; font-size: 16px; opacity: .9; }
  .montre { font-size: 64px; filter: drop-shadow(0 0 16px rgba(94,230,255,.8)); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .gros { border: 2px solid var(--cyan); border-radius: 999px; padding: 14px 34px; background: rgba(94,230,255,.15); color: #fff; font: 700 19px system-ui, Arial; box-shadow: 0 0 22px rgba(94,230,255,.45); cursor: pointer; }
  #barre { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: none; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.65)); }
  #barre button, #barre label { border: 1px solid rgba(94,230,255,.6); border-radius: 999px; padding: 10px 16px; background: rgba(0,20,30,.6); color: #fff; font: 600 15px system-ui, Arial; cursor: pointer; backdrop-filter: blur(6px); }
  #barre .actif { background: rgba(94,230,255,.3); }
  #info { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 4; max-width: calc(100% - 32px); padding: 8px 16px; border-radius: 999px; background: rgba(0,20,30,.65); border: 1px solid rgba(94,230,255,.45); font: 600 15px system-ui, Arial; text-align: center; display: none; }
  #erreur { color: #ffb4a8; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="scene"></canvas>

<div id="accueil">
  <div class="montre">⌚</div>
  <h1>Hologramme</h1>
  <p>Filme ta montre avec la caméra, puis <b>touche-la sur l'écran</b> : la personne qui t'appelle en sort en hologramme.</p>
  <p style="font-size:14px;opacity:.7">Ça marche aussi sur une table ou un objet : touche l'endroit d'où elle doit sortir.</p>
  <button class="gros" id="go" type="button">▶ Démarrer</button>
  <p id="erreur"></p>
</div>
<div id="info"></div>
<div id="barre">
  <button type="button" id="bDemo" class="actif">🎬 Démo</button>
  <label>📁 Ma vidéo<input type="file" id="fichier" accept="video/*" hidden></label>
  <button type="button" id="bQuit">✕ Quitter</button>
</div>

<script type="module">

const cadran = { vu: 0, der: null, perdu: 9 };

    cx.shadowColor = "rgba(94,230,255,.9)"; cx.shadowBlur = auto ? 10 : 0; cx.beginPath(); cx.ellipse(x, y, rr * f, rb * f, ang, 0, Math.PI * 2); cx.stroke(); }
  cx.shadowBlur = 0; cx.setLineDash([]); const halo = cx.createRadialGradient(x, y, 0, x, y, rr); halo.addColorStop(0, "rgba(160,250,255,.65)"); halo.addColorStop(1, "rgba(94,230,255,.08)");
  cx.fillStyle = halo; cx.beginPath(); cx.ellipse(x, y, rr * (auto ? 1 : 1.4), rb * (auto ? 1 : 1.6), ang, 0, Math.PI * 2); cx.fill(); cx.restore();

  if (h < 4) return;
  // la personne, teintée de bleu, rayée de lignes, qui scintille
  const tw = Math.ceil(w), th = Math.ceil(h); if (tampon.width !== tw || tampon.height !== th) { tampon.width = tw; tampon.height = th; }
  tx.globalCompositeOperation = "source-over"; tx.globalAlpha = 1; tx.clearRect(0, 0, tw, th);
  const resp = holo.parle ? 1 + Math.sin(now / 90) * .006 : 1 + Math.sin(now / 900) * .004;   // (elle respire ; un peu plus quand elle parle)
  tx.drawImage(src.c, b.x, b.y, b.w, b.h, 0, th * (1 - resp), tw, th * resp);
  tx.globalCompositeOperation = "source-atop";
  tx.fillStyle = "rgba(60,190,255,.38)"; tx.fillRect(0, 0, tw, th);
  tx.fillStyle = "rgba(0,10,25,.35)"; const pas = Math.max(3, th / 110), dec = (now / 40) % pas; for (let ly = -pas + dec; ly < th; ly += pas) tx.fillRect(0, ly, tw, pas * .45);
  const bande = (now / 7) % (th * 1.6) - th * .3; const gb = tx.createLinearGradient(0, bande - 20, 0, bande + 20); gb.addColorStop(0, "rgba(160,250,255,0)"); gb.addColorStop(.5, "rgba(160,250,255,.35)"); gb.addColorStop(1, "rgba(160,250,255,0)"); tx.fillStyle = gb; tx.fillRect(0, bande - 20, tw, 40);
  // (elle sort du faisceau : le bas se fond dans la lumière)
  tx.globalCompositeOperation = "destination-out"; const gf = tx.createLinearGradient(0, th, 0, th * .82); gf.addColorStop(0, "rgba(0,0,0,.85)"); gf.addColorStop(1, "rgba(0,0,0,0)"); tx.fillStyle = gf; tx.fillRect(0, th * .82, tw, th * .18);

  const scint = .82 + Math.random() * .1 - (Math.random() < .03 ? .35 : 0);
  const px = x - w / 2, py = y - lev - h;
  cx.save(); cx.globalAlpha = scint * Math.min(1, k * 1.4); cx.shadowColor = "rgba(94,230,255,.9)"; cx.shadowBlur = 18;
  if (Math.random() < .05) {   // (un petit accroc : une tranche décalée)
    const sy = Math.random() * th, sh = 4 + Math.random() * th * .08, d = (Math.random() - .5) * w * .12;
    cx.drawImage(tampon, 0, 0, tw, sy, px, py, w, sy); cx.drawImage(tampon, 0, sy, tw, sh, px + d, py + sy, w, sh); cx.drawImage(tampon, 0, sy + sh, tw, th - sy - sh, px, py + sy + sh, w, th - sy - sh);
  } else cx.drawImage(tampon, px, py, w, h);
  cx.shadowBlur = 0; cx.globalCompositeOperation = "lighter"; cx.globalAlpha = .25 * scint; cx.drawImage(tampon, px, py, w, h);   // (la lueur)
  cx.restore();
}

function boucle() {
  const now = performance.now(), dt = Math.min(.1, (now - (boucle.t || now)) / 1000); boucle.t = now;
  try { majSource(now); } catch (e) { console.warn(e); }
  let m = null; try { m = chercherCadran(dt); } catch (e) { console.warn(e); }
  if (m) suivi.on = false; else try { m = suivi.on ? suivreMontre(dt) : suivreMain(now); } catch (e) { console.warn(e); }
  if (m && m.ea) { const a = 1 - Math.exp(-dt * 12); if (!holo.ea) Object.assign(holo, { ea: m.ea, eb: m.eb, ang: m.ang });
    holo.ea += (m.ea - holo.ea) * a; holo.eb += (m.eb - holo.eb) * a; let da = m.ang - holo.ang; da = Math.atan2(Math.sin(2 * da), Math.cos(2 * da)) / 2; holo.ang += da * a; }
  else if (m) holo.ea = 0;
  if (m) { holo.vu += dt; holo.perdu = 0;
    const cible = Math.max(110, Math.min(innerHeight * .78, (m.ech || 0) * 4.2));
    if (holo.etat === "attente" || !holo.x) { holo.x = m.x; holo.y = m.y; holo.taille = cible; }
    const a = 1 - Math.exp(-dt * 14); holo.x += (m.x - holo.x) * a; holo.y += (m.y - holo.y) * a; holo.taille += (cible - holo.taille) * (1 - Math.exp(-dt * 4)); }
  else { holo.perdu += dt; if (holo.perdu > .25) holo.vu = 0; }
  // l'appel : le poignet reste à l'image → ça sonne, puis la personne apparaît ; le bras baissé → elle se replie dans la montre
  if (holo.etat === "attente" && holo.vu > .35) { holo.etat = "sonne"; holo.t = 0; sonnerie(); info("📞 Appel entrant…"); }
  else if (holo.etat === "sonne") { holo.t += dt; if (!m && holo.perdu > .8) { holo.etat = "attente"; info(""); } else if (holo.t > 1) { holo.etat = "ouvert"; ouverture(); bourdonner(true); info(src.demo ? "Le chef de poste" : "", 2500); setTimeout(() => holo.etat === "ouvert" && parler(), 700); } }
  else if (holo.etat === "ouvert" && !m && holo.perdu > .8) { holo.etat = "attente"; fermeture(); bourdonner(false); taire(); info(""); }
  const voulu = holo.etat === "ouvert" ? 1 : holo.etat === "sonne" ? .06 : 0;
  holo.k += (voulu - holo.k) * (1 - Math.exp(-dt * (voulu > holo.k ? 4.5 : 9))); if (holo.k < .002 && !voulu) holo.k = 0;
  dessinerHolo(now, dt);
  requestAnimationFrame(boucle);
}

function taille() { scene.width = innerWidth * devicePixelRatio; scene.height = innerHeight * devicePixelRatio; }
addEventListener("resize", taille); taille();

// toucher sa montre sur l'écran : le téléphone la suit, et l'hologramme en sort (ça marche aussi sur une table, un objet…)
scene.addEventListener("pointerdown", e => verrouiller(e.clientX, e.clientY));

$("#fichier").addEventListener("change", e => { const f = e.target.files[0]; if (f) choisirVideo(f); });
$("#bDemo").onclick = async () => { if (src.video) { src.video.pause(); src.video = null; } src.demo = true; $("#bDemo").classList.add("actif"); await chargerDemo(); };
$("#bQuit").onclick = () => { location.href = "/"; };

$("#go").onclick = async () => {
  const go = $("#go"); go.disabled = true; go.textContent = "Chargement…"; $("#erreur").textContent = "";
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch (e) { }
  try { speechSynthesis.getVoices(); } catch (e) { }
  try {
    const flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    cam.srcObject = flux; await cam.play();
  } catch (e) { $("#erreur").textContent = "Je n'ai pas accès à la caméra : autorise-la dans le navigateur, puis réessaie."; go.disabled = false; go.textContent = "▶ Démarrer"; return; }
  try {
    const vision = await FilesetResolver.forVisionTasks("vendor/mediapipe/wasm");
    const creer = async (delegate) => {
      mains = await HandLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: "vendor/mediapipe/hand_landmarker.task", delegate }, runningMode: "VIDEO", numHands: 2, minHandDetectionConfidence: .5, minTrackingConfidence: .5 });
      segImg = await ImageSegmenter.createFromOptions(vision, { baseOptions: { modelAssetPath: "vendor/mediapipe/selfie_segmenter.tflite", delegate }, runningMode: "IMAGE", outputConfidenceMasks: true, outputCategoryMask: false });
      segVid = await ImageSegmenter.createFromOptions(vision, { baseOptions: { modelAssetPath: "vendor/mediapipe/selfie_segmenter.tflite", delegate }, runningMode: "VIDEO", outputConfidenceMasks: true, outputCategoryMask: false });
    };
    try { await creer("GPU"); } catch (e) { console.warn("GPU indisponible, on passe au processeur", e); await creer("CPU"); }
    await chargerDemo();
  } catch (e) { console.error(e); $("#erreur").textContent = "Le chargement a échoué : " + (e.message || e); go.disabled = false; go.textContent = "▶ Démarrer"; return; }
  $("#accueil").style.display = "none"; $("#barre").style.display = "flex";
  info("⌚ Filme ta montre (si elle n'est pas repérée, touche-la)", 6000);
  requestAnimationFrame(boucle);
};
